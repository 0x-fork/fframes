[package]
name = "marketing-example"
version = "0.1.0"
edition = "2021"

[dependencies]
svgr-macro = { path="../../svgr-macro" }
fframes = {path="../../fframes"}
lazy_static = "1.4.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fframes_renderer ={path="../../fframes-renderer"}


[lib]
name = "marketing_example"
path = "src/lib.rs"

[[bin]]
name = "marketing_example_bin"
path = "src/main.rs"