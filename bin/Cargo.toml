[package]
name = "fframes-renderer"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tiny-skia = "0.6.1"
resvg = "0.21.0"
usvg = "0.21.0"
handlebars = "4.0.1"
rayon = "1.5.1"
colored = "2"

syn = { version = "1", features = ["full", "parsing", "extra-traits"] }
ffmpeg-next = "4.4.0"
uuid = { version = "0.8", features = ["v4"] }

svgr-macro = { path="../svgr-macro" }
fframes = {path="../fframes"}
media-loader = {path="../media-loader"}
video = { path = "../video" }

[build-dependencies]
cc = "1.0"

[[bin]]
name = "fframes"
path = "main.rs"
