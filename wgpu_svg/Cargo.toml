[package]
name = "svg-rendering-example"
description = "A simple svg renderer based on resvg"
version = "0.1.0"
authors = ["Roland Kovacs <zen3ger@gmail.com>"]
edition = "2018"
resolver="2"

[[bin]]
name = "wgpu_svg"
path = "src/main.rs"

[dependencies]
lyon = "0.17.10"
clap = "2.32.0"
wgpu = "0.12.0"
winit = "0.26"
usvg = "0.15.0"
futures = "0.3.5"
bytemuck = "1.2.0"
env_logger = "0.9.0"
image = "0.24.1"