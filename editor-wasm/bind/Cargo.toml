[package]
name = "fframes-editor-bind"
version = "0.1.0"
authors = ["Dmitriy Kovalenko <dmtr.kovalenko@outlook.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wasm-bindgen = "0.2.74"
fframes = { path = "../../fframes" }
fframes-editor-controller = { path = "../../fframes-editor-controller" }
video = { path = "../../video" }
svgr-macro = { path = "../../svgr-macro" }
lazy_static = "1.4.0"
console_error_panic_hook = "0.1.6"
wasm-bindgen-futures= "0.4.28"
js-sys = "0.3.55"